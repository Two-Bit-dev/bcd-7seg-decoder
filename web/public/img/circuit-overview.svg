<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:2;rx:10}
      .title{font-size:20px;font-weight:bold;fill:#111}
      .step{font-size:14px;fill:#fff;font-weight:bold}
      .t{font-size:16px;fill:#222}
      .mono{font-family:Menlo, Consolas, monospace;font-size:15px;fill:#222}
      .small{font-size:13px;fill:#555}
      .wire{stroke:#333;stroke-width:3;fill:none}
      .red{stroke:#c0392b;stroke-width:3;fill:none}
    </style>
  </defs>
  <rect width="1500" height="860" fill="#fafafa"/>
  <text x="750" y="40" text-anchor="middle" style="font-size:26px;font-weight:bold">Decodificador BCD → 7 segmentos: cómo fluye la señal (de izquierda a derecha)</text>

  <!-- Stage 1: Inputs -->
  <rect class="box" x="30" y="90" width="170" height="420" rx="10"/>
  <rect x="30" y="90" width="170" height="34" rx="10" fill="#2c3e50"/>
  <text class="step" x="115" y="113" text-anchor="middle">1 · ENTRADAS</text>
  <g class="mono">
    <text x="55" y="170">A  (MSB, 8)</text>
    <text x="55" y="250">B  (4)</text>
    <text x="55" y="330">C  (2)</text>
    <text x="55" y="410">D  (LSB, 1)</text>
  </g>
  <text class="small" x="115" y="480" text-anchor="middle">4 pines de entrada</text>
  <text class="small" x="115" y="498" text-anchor="middle">(interruptores)</text>

  <!-- Stage 2: NOT -->
  <rect class="box" x="250" y="90" width="170" height="420" rx="10"/>
  <rect x="250" y="90" width="170" height="34" rx="10" fill="#2c3e50"/>
  <text class="step" x="335" y="113" text-anchor="middle">2 · COMPUERTAS NOT</text>
  <g class="mono">
    <text x="275" y="250">B → B'</text>
    <text x="275" y="330">C → C'</text>
    <text x="275" y="410">D → D'</text>
  </g>
  <text class="small" x="335" y="170" text-anchor="middle">A' nunca se necesita</text>
  <text class="small" x="335" y="480" text-anchor="middle">3 compuertas NOT</text>
  <text class="small" x="335" y="498" text-anchor="middle">compartidas por todos</text>

  <!-- Stage 3: AND -->
  <rect class="box" x="470" y="90" width="220" height="420" rx="10"/>
  <rect x="470" y="90" width="220" height="34" rx="10" fill="#2c3e50"/>
  <text class="step" x="580" y="113" text-anchor="middle">3 · TÉRMINOS AND</text>
  <g class="mono">
    <text x="495" y="160">T1 = B·D</text>
    <text x="495" y="192">T2 = B'·D'</text>
    <text x="495" y="224">T3 = C'·D'</text>
    <text x="495" y="256">T4 = C·D</text>
    <text x="495" y="288">T5 = B'·C</text>
    <text x="495" y="320">T6 = C·D'</text>
    <text x="495" y="352">T7 = B·C'</text>
    <text x="495" y="384">T8 = B·D'</text>
    <text x="495" y="416">T9 = B·C'·D</text>
  </g>
  <text class="small" x="580" y="480" text-anchor="middle">9 compuertas AND, cada una</text>
  <text class="small" x="580" y="498" text-anchor="middle">se construye UNA vez y se reutiliza</text>

  <!-- Stage 4: OR -->
  <rect class="box" x="740" y="90" width="290" height="420" rx="10"/>
  <rect x="740" y="90" width="290" height="34" rx="10" fill="#2c3e50"/>
  <text class="step" x="885" y="113" text-anchor="middle">4 · UNA OR POR SEGMENTO</text>
  <g class="mono">
    <text x="760" y="165">a = A + C + T1 + T2</text>
    <text x="760" y="210">b = B' + T3 + T4</text>
    <text x="760" y="255">c = B + C' + D</text>
    <text x="760" y="300">d = A+T2+T5+T6+T9</text>
    <text x="760" y="345">e = T2 + T6</text>
    <text x="760" y="390">f = A + T3 + T7 + T8</text>
    <text x="760" y="435">g = A + T5 + T7 + T6</text>
  </g>
  <text class="small" x="885" y="480" text-anchor="middle">7 compuertas OR (ajusta "Number of</text>
  <text class="small" x="885" y="498" text-anchor="middle">Inputs" a 2–5 según haga falta)</text>

  <!-- Stage 5: Override -->
  <rect class="box" x="1080" y="90" width="200" height="420" rx="10" style="stroke:#c0392b"/>
  <rect x="1080" y="90" width="200" height="34" rx="10" fill="#c0392b"/>
  <text class="step" x="1180" y="113" text-anchor="middle">6 · FORZADO DE "E"</text>
  <g class="mono">
    <text x="1095" y="165">a + INV</text>
    <text x="1095" y="210">b · INV'</text>
    <text x="1095" y="255">c · INV'</text>
    <text x="1095" y="300">d + INV</text>
    <text x="1095" y="345">e + INV</text>
    <text x="1095" y="390">f + INV</text>
    <text x="1095" y="435">g + INV</text>
  </g>
  <text class="small" x="1180" y="480" text-anchor="middle">5 OR + 2 AND</text>
  <text class="small" x="1180" y="498" text-anchor="middle">+ 1 NOT (INV')</text>

  <!-- Display -->
  <rect class="box" x="1320" y="90" width="160" height="420" rx="10"/>
  <rect x="1320" y="90" width="160" height="34" rx="10" fill="#2c3e50"/>
  <text class="step" x="1400" y="113" text-anchor="middle">7 · DISPLAY</text>
  <g fill="#e74c3c">
    <rect x="1362" y="170" width="76" height="12" rx="5"/>   <!-- a -->
    <rect x="1438" y="182" width="12" height="76" rx="5"/>   <!-- b -->
    <rect x="1438" y="270" width="12" height="76" rx="5"/>   <!-- c -->
    <rect x="1362" y="346" width="76" height="12" rx="5"/>   <!-- d -->
    <rect x="1350" y="270" width="12" height="76" rx="5"/>   <!-- e -->
    <rect x="1350" y="182" width="12" height="76" rx="5"/>   <!-- f -->
    <rect x="1362" y="258" width="76" height="12" rx="5"/>   <!-- g -->
  </g>
  <g class="t" style="font-weight:bold">
    <text x="1400" y="164" text-anchor="middle">a</text>
    <text x="1462" y="225">b</text>
    <text x="1462" y="313">c</text>
    <text x="1400" y="380" text-anchor="middle">d</text>
    <text x="1330" y="313">e</text>
    <text x="1330" y="225">f</text>
    <text x="1400" y="252" text-anchor="middle">g</text>
  </g>
  <text class="small" x="1400" y="480" text-anchor="middle">7-Segment Display</text>
  <text class="small" x="1400" y="498" text-anchor="middle">(biblioteca I/O)</text>

  <!-- arrows between stages -->
  <line class="wire" x1="200" y1="300" x2="246" y2="300" marker-end="url(#arr)"/>
  <line class="wire" x1="420" y1="300" x2="466" y2="300" marker-end="url(#arr)"/>
  <line class="wire" x1="690" y1="300" x2="736" y2="300" marker-end="url(#arr)"/>
  <line class="wire" x1="1030" y1="300" x2="1076" y2="300" marker-end="url(#arr)"/>
  <line class="wire" x1="1280" y1="300" x2="1316" y2="300" marker-end="url(#arr)"/>
  <!-- A and C also go straight to OR stage (bypass) -->
  <path class="wire" d="M200,160 Q220,70 470,70 L860,70 L860,86" marker-end="url(#arr)" style="stroke-dasharray:6 5"/>
  <text class="small" x="480" y="62">A, B, C, D (y B', C') también entran directo a las OR</text>

  <!-- Stage 5: Detector -->
  <rect class="box" x="470" y="590" width="560" height="200" rx="10" style="stroke:#c0392b"/>
  <rect x="470" y="590" width="560" height="34" rx="10" fill="#c0392b"/>
  <text class="step" x="750" y="613" text-anchor="middle">5 · DETECTOR INVALID (entradas 10–15)</text>
  <g class="mono">
    <text x="495" y="665">X1 = A·B      (12, 13, 14, 15)</text>
    <text x="495" y="700">X2 = A·C      (10, 11, 14, 15)</text>
    <text x="495" y="735" style="font-weight:bold">INV = X1 + X2</text>
  </g>
  <text class="small" x="750" y="775" text-anchor="middle">2 AND + 1 OR · INV = 1 significa "no es un dígito válido"</text>

  <!-- input to detector -->
  <path class="red" d="M115,510 L115,690 L466,690" marker-end="url(#arrR)"/>
  <text class="small" x="130" y="680">A, B, C</text>
  <!-- detector to override -->
  <path class="red" d="M1030,690 L1180,690 L1180,514" marker-end="url(#arrR)"/>
  <text x="1190" y="640" style="font-size:16px;fill:#c0392b;font-weight:bold">INV</text>

  <!-- legend -->
  <text class="small" x="30" y="835">Negro = decodificador de los dígitos 0–9 (de los mapas K).  Rojo = ruta de error que fuerza la letra "E" (segmentos a, d, e, f, g encendidos; b, c apagados) para las entradas 10–15.</text>
</svg>
